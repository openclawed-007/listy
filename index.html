<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico?v=7" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=7" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6b8f71" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="CartLink is a free shared shopping list that syncs in real time across every phone in your household. Share it with a link or a QR code — helpers don't need an account. No ads, works offline, native Android app."
    />
    <link rel="canonical" href="https://cartlink.co.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:site_name" content="CartLink" />
    <meta property="og:title" content="CartLink — the shared shopping list nobody has to install" />
    <meta
      property="og:description"
      content="Add it on the sofa, tick it off in aisle four. A free shared shopping list that syncs in real time. Share with a link or QR code — no account needed to help."
    />
    <meta property="og:url" content="https://cartlink.co.uk/" />
    <meta property="og:image" content="https://cartlink.co.uk/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CartLink — Add it on the sofa. Tick it off in aisle four. A shared shopping list card showing items being ticked off live."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CartLink — the shared shopping list nobody has to install" />
    <meta
      name="twitter:description"
      content="A free shared shopping list that syncs in real time. Share with a link or QR code — helpers don't need an account. No ads, works offline."
    />
    <meta name="twitter:image" content="https://cartlink.co.uk/og-image.jpg" />

    <title>CartLink — Free shared shopping list with real-time sync & QR sharing</title>

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "CartLink",
        "url": "https://cartlink.co.uk/",
        "description": "A free shared shopping list that syncs in real time across devices. Share with a link or QR code; helpers don't need an account. Works offline, with a native Android app.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any (web), Android",
        "browserRequirements": "Requires JavaScript",
        "image": "https://cartlink.co.uk/og-image.jpg",
        "inLanguage": "en-GB",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "GBP"
        },
        "featureList": [
          "Real-time sync across devices",
          "Share by link or QR code",
          "Guest editing without an account",
          "Granular collaborator permissions",
          "Quantities and categories",
          "Undo delete",
          "Offline support",
          "Dark mode"
        ],
        "downloadUrl": "https://github.com/openclawed-007/listy/releases/latest",
        "sameAs": ["https://github.com/openclawed-007/listy"],
        "author": {
          "@type": "Organization",
          "name": "CartLink",
          "url": "https://cartlink.co.uk/",
          "email": "hello@cartlink.co.uk"
        }
      }
    </script>
    <script>
      try {
        // Tokens use html.dark so this can run in <head> before body exists.
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>
  <body>
    <noscript>
      <p style="font-family: system-ui, sans-serif; text-align: center; padding: 3rem 1.5rem">
        CartLink needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
