    />
    <meta name="description" content="CartLink is the fast shared shopping list that sorts groceries by aisle. Add items naturally, shop together in real time, and install it free." />

    <title>CartLink — shared shopping lists</title>
    <script>
      try {
        // Tokens use html.dark so this can run in <head> before body exists.
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch {}
    </script>
  </head>

    <noscript>
      <p style="font-family: system-ui, sans-serif; text-align: center; padding: 3rem 1.5rem">
        CartLink needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
